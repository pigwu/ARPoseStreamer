name: ARPoseStreamer

options:
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.example.ARPoseStreamer
    INFOPLIST_FILE: Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    CODE_SIGN_STYLE: Automatic

targets:
  ARPoseStreamer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Assets.xcassets
      - path: ARPositionApp.swift
      - path: ContentView.swift
      - path: ARCameraPreviewView.swift
      - path: AppSettingsView.swift
      - path: CaptureHistoryView.swift
      - path: PositionViewModel.swift
      - path: ARPoseUDPSender.swift
      - path: ARLowLatencyVideoSender.swift
      - path: MagneticSensorProtocol.swift
      - path: PoseMagneticPacket.swift
      - path: MagneticSensorHotspotGateway.swift
      - path: WiredSensorPoseBridge.swift
      - path: SensorPoseStreamRecorder.swift
      - path: ARSessionVideoRecorder.swift
      - path: PoseDataSessionRecorder.swift
      - path: CaptureLibraryStore.swift
      - path: CaptureUploadService.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO

schemes:
  ARPoseStreamer:
    build:
      targets:
        ARPoseStreamer: all
    run:
      config: Debug
