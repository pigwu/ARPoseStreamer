<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="crossBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="url(#crossBg)" opacity="0.1"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#crossBg)" stroke-width="2" opacity="0.3"/>

  <!-- Platform icons -->
  <g filter="url(#glow3)">
    <!-- Windows logo -->
    <g transform="translate(60, 70)">
      <rect x="0" y="0" width="15" height="15" fill="#00d2ff" opacity="0.8"/>
      <rect x="17" y="0" width="15" height="15" fill="#00d2ff" opacity="0.8"/>
      <rect x="0" y="17" width="15" height="15" fill="#00d2ff" opacity="0.8"/>
      <rect x="17" y="17" width="15" height="15" fill="#00d2ff" opacity="0.8"/>
    </g>

    <!-- macOS logo (Apple) -->
    <g transform="translate(115, 70)">
      <path d="M 10,0 Q 15,-5 20,0 Q 25,5 20,15 Q 15,25 10,20 Q 5,15 0,15 Q -5,10 0,5 Q 5,0 10,0"
            fill="#38ef7d"
            opacity="0.8"/>
      <circle cx="15" cy="-3" r="3" fill="#38ef7d" opacity="0.8"/>
    </g>

    <!-- iPhone -->
    <g transform="translate(85, 120)">
      <rect x="0" y="0" width="30" height="50" rx="5" fill="none" stroke="#11998e" stroke-width="3"/>
      <circle cx="15" cy="45" r="2" fill="#11998e"/>
      <line x1="10" y1="5" x2="20" y2="5" stroke="#11998e" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Connection lines -->
  <line x1="75" y1="95" x2="85" y2="120" stroke="#38ef7d" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="125" y1="95" x2="115" y2="120" stroke="#38ef7d" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Label -->
  <text x="100" y="190" fill="#11998e" font-size="12" font-family="Arial" text-anchor="middle" font-weight="bold">Cross-Platform</text>
</svg>
