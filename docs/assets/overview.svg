<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="60" x2="1120" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E78E8"/>
      <stop offset="1" stop-color="#0D4FA5"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="560" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1160" height="520" rx="36" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="80" y="110" width="250" height="340" rx="34" fill="white" fill-opacity="0.12"/>
    <rect x="475" y="80" width="250" height="160" rx="28" fill="white" fill-opacity="0.12"/>
    <rect x="475" y="290" width="250" height="160" rx="28" fill="white" fill-opacity="0.12"/>
    <rect x="870" y="80" width="250" height="160" rx="28" fill="white" fill-opacity="0.12"/>
    <rect x="870" y="290" width="250" height="160" rx="28" fill="white" fill-opacity="0.12"/>
  </g>

  <text x="80" y="64" fill="white" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">ARPoseStreamer Workflow</text>
  <text x="80" y="92" fill="white" fill-opacity="0.82" font-size="18" font-family="Arial, Helvetica, sans-serif">Real-time UDP pose streaming plus offline-aligned video and pose upload</text>

  <rect x="138" y="152" width="134" height="236" rx="24" stroke="white" stroke-width="10"/>
  <rect x="158" y="188" width="94" height="148" rx="14" stroke="white" stroke-opacity="0.45" stroke-width="4"/>
  <rect x="183" y="167" width="44" height="10" rx="5" fill="white"/>
  <circle cx="205" cy="356" r="10" fill="white"/>
  <text x="117" y="420" fill="white" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">iPhone App</text>
  <text x="118" y="448" fill="white" fill-opacity="0.84" font-size="16" font-family="Arial, Helvetica, sans-serif">ARKit tracking</text>
  <text x="118" y="470" fill="white" fill-opacity="0.84" font-size="16" font-family="Arial, Helvetica, sans-serif">UDP pose sender</text>
  <text x="118" y="492" fill="white" fill-opacity="0.84" font-size="16" font-family="Arial, Helvetica, sans-serif">Local video + pose capture</text>

  <text x="512" y="128" fill="white" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700">Real-time Pose</text>
  <text x="512" y="164" fill="white" fill-opacity="0.88" font-size="16" font-family="Arial, Helvetica, sans-serif">UDP: x, y, z, qx, qy, qz, qw</text>
  <text x="512" y="188" fill="white" fill-opacity="0.88" font-size="16" font-family="Arial, Helvetica, sans-serif">~60 Hz on local network</text>

  <text x="512" y="338" fill="white" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700">Offline Capture</text>
  <text x="512" y="374" fill="white" fill-opacity="0.88" font-size="16" font-family="Arial, Helvetica, sans-serif">MP4 video</text>
  <text x="512" y="398" fill="white" fill-opacity="0.88" font-size="16" font-family="Arial, Helvetica, sans-serif">pose.csv</text>
  <text x="512" y="422" fill="white" fill-opacity="0.88" font-size="16" font-family="Arial, Helvetica, sans-serif">capture_manifest.json</text>

  <text x="907" y="128" fill="white" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700">Host Receiver</text>
  <text x="907" y="164" fill="white" fill-opacity="0.88" font-size="16" font-family="Arial, Helvetica, sans-serif">macOS or Windows</text>
  <text x="907" y="188" fill="white" fill-opacity="0.88" font-size="16" font-family="Arial, Helvetica, sans-serif">udp_pose_receiver.py</text>

  <text x="907" y="338" fill="white" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700">Upload Target</text>
  <text x="907" y="374" fill="white" fill-opacity="0.88" font-size="16" font-family="Arial, Helvetica, sans-serif">Local HTTP upload server</text>
  <text x="907" y="398" fill="white" fill-opacity="0.88" font-size="16" font-family="Arial, Helvetica, sans-serif">capture_upload_server.py</text>
  <text x="907" y="422" fill="white" fill-opacity="0.88" font-size="16" font-family="Arial, Helvetica, sans-serif">Video and pose re-upload supported</text>

  <path d="M338 190H455" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <path d="M435 168L461 190L435 212" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M338 370H455" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <path d="M435 348L461 370L435 392" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M738 160H850" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <path d="M830 138L856 160L830 182" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M738 370H850" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <path d="M830 348L856 370L830 392" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="352" y="175" fill="white" fill-opacity="0.86" font-size="15" font-family="Arial, Helvetica, sans-serif">stream</text>
  <text x="352" y="355" fill="white" fill-opacity="0.86" font-size="15" font-family="Arial, Helvetica, sans-serif">save</text>
  <text x="755" y="145" fill="white" fill-opacity="0.86" font-size="15" font-family="Arial, Helvetica, sans-serif">receive</text>
  <text x="758" y="355" fill="white" fill-opacity="0.86" font-size="15" font-family="Arial, Helvetica, sans-serif">upload</text>
</svg>
