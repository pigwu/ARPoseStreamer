<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#203a43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5364;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#00d2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d2ff;stop-opacity:0.2" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- iPhone illustration -->
  <g transform="translate(150, 100)">
    <!-- Phone body -->
    <rect x="0" y="0" width="120" height="200" rx="15" fill="url(#phoneGrad)" stroke="#ffffff" stroke-width="2"/>
    <rect x="5" y="5" width="110" height="190" rx="12" fill="#1a1a1a"/>

    <!-- Screen content -->
    <circle cx="60" cy="30" r="3" fill="#00ff00"/>
    <text x="60" y="50" fill="#00d2ff" font-size="10" font-family="Arial" text-anchor="middle" font-weight="bold">ARKit</text>

    <!-- Trajectory visualization -->
    <path d="M 20,80 Q 40,60 60,80 T 100,80" stroke="#00d2ff" stroke-width="2" fill="none"/>
    <circle cx="20" cy="80" r="3" fill="#ff0000"/>
    <circle cx="100" cy="80" r="3" fill="#00ffff"/>

    <!-- Coordinate display -->
    <text x="15" y="120" fill="#ffffff" font-size="8" font-family="monospace">X: 0.012</text>
    <text x="15" y="132" fill="#ffffff" font-size="8" font-family="monospace">Y: -0.031</text>
    <text x="15" y="144" fill="#ffffff" font-size="8" font-family="monospace">Z: 0.842</text>

    <!-- Record button -->
    <circle cx="60" cy="175" r="8" fill="#ff0000" opacity="0.8"/>

    <!-- Label -->
    <text x="60" y="230" fill="#ffffff" font-size="14" font-family="Arial" text-anchor="middle" font-weight="bold">iPhone</text>
    <text x="60" y="245" fill="#00d2ff" font-size="10" font-family="Arial" text-anchor="middle">ARKit Streaming</text>
  </g>

  <!-- Data flow animation -->
  <g>
    <!-- UDP packets -->
    <path d="M 330,200 L 870,200" stroke="url(#dataFlow)" stroke-width="3" stroke-dasharray="10,5"/>

    <!-- Animated dots -->
    <circle cx="400" cy="200" r="4" fill="#00d2ff">
      <animate attributeName="cx" from="330" to="870" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="200" r="4" fill="#00d2ff">
      <animate attributeName="cx" from="330" to="870" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="200" r="4" fill="#00d2ff">
      <animate attributeName="cx" from="330" to="870" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>

    <!-- UDP label -->
    <rect x="550" y="170" width="100" height="25" rx="5" fill="#000000" opacity="0.7"/>
    <text x="600" y="188" fill="#00d2ff" font-size="12" font-family="monospace" text-anchor="middle" font-weight="bold">UDP 5555</text>
    <text x="600" y="220" fill="#ffffff" font-size="9" font-family="Arial" text-anchor="middle">60 FPS Pose Stream</text>
  </g>

  <!-- PC/Mac illustration -->
  <g transform="translate(900, 100)">
    <!-- Monitor -->
    <rect x="0" y="0" width="180" height="120" rx="8" fill="url(#pcGrad)" stroke="#ffffff" stroke-width="2"/>
    <rect x="5" y="5" width="170" height="110" rx="5" fill="#1a1a1a"/>

    <!-- Screen content - 3D visualization -->
    <g transform="translate(10, 10)">
      <!-- 3D trajectory -->
      <defs>
        <linearGradient id="traj3d" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#ffff00;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#00ffff;stop-opacity:1" />
        </linearGradient>
      </defs>
      <path d="M 20,50 Q 50,30 80,50 T 140,50" stroke="url(#traj3d)" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- Axes -->
      <line x1="10" y1="90" x2="30" y2="90" stroke="#ff0000" stroke-width="1.5"/>
      <line x1="10" y1="90" x2="10" y2="70" stroke="#00ff00" stroke-width="1.5"/>
      <line x1="10" y1="90" x2="5" y2="85" stroke="#0000ff" stroke-width="1.5"/>

      <!-- Stats -->
      <text x="5" y="15" fill="#00d2ff" font-size="8" font-family="monospace">FPS: 60</text>
      <text x="80" y="15" fill="#00ff00" font-size="8" font-family="monospace">● LIVE</text>
    </g>

    <!-- Monitor stand -->
    <rect x="70" y="120" width="40" height="5" rx="2" fill="#667eea"/>
    <rect x="50" y="125" width="80" height="3" rx="1" fill="#667eea"/>

    <!-- Label -->
    <text x="90" y="155" fill="#ffffff" font-size="14" font-family="Arial" text-anchor="middle" font-weight="bold">PC / Mac</text>
    <text x="90" y="170" fill="#f5576c" font-size="10" font-family="Arial" text-anchor="middle">3D Visualizer</text>
  </g>

  <!-- Feature badges -->
  <g transform="translate(400, 320)">
    <rect x="0" y="0" width="100" height="30" rx="15" fill="#00d2ff" opacity="0.2" stroke="#00d2ff" stroke-width="1"/>
    <text x="50" y="20" fill="#00d2ff" font-size="11" font-family="Arial" text-anchor="middle" font-weight="bold">Real-time</text>
  </g>

  <g transform="translate(520, 320)">
    <rect x="0" y="0" width="100" height="30" rx="15" fill="#00ff00" opacity="0.2" stroke="#00ff00" stroke-width="1"/>
    <text x="50" y="20" fill="#00ff00" font-size="11" font-family="Arial" text-anchor="middle" font-weight="bold">60 FPS</text>
  </g>

  <g transform="translate(640, 320)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#f5576c" opacity="0.2" stroke="#f5576c" stroke-width="1"/>
    <text x="60" y="20" fill="#f5576c" font-size="11" font-family="Arial" text-anchor="middle" font-weight="bold">Cross-platform</text>
  </g>

  <!-- Decorative elements -->
  <circle cx="100" cy="50" r="3" fill="#00d2ff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="350" r="3" fill="#f5576c" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="350" r="2" fill="#00ff00" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
